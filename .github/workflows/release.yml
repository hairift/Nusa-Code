name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nusa
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nusa.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: nusa
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nusa
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/nusa-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nusa-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum nusa-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: NusaCode ${{ github.ref_name }}
          files: |
            artifacts/nusa-*
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
